# Prebuilt wheels, so that `pip install stream-cqsa` needs no compiler.
#
# On a tag `vX.Y.Z` (or by hand): one pure-Python wheel (Triton kernels, no
# extension: runs anywhere Triton runs) and one binary wheel per (python, torch,
# CUDA) pair with the CUDA extension for sm80/86/89/90. Wheels are attached to
# the GitHub release; the install line in the README then resolves to them.
name: wheels
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_cuda:
        description: "also build the CUDA-extension wheels (public repo runners: 4 cores / 16 GB, one arch per job)"
        type: boolean
        default: false
      runner:
        description: "runner label for the CUDA jobs (e.g. a larger runner)"
        type: string
        default: "ubuntu-22.04"
      single:
        description: "build only one CUDA wheel (python 3.11, torch 2.6.0) to diagnose"
        type: boolean
        default: false

jobs:
  pure:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # two installs: the PyTorch index only carries torch, so `build`/`wheel` must come from PyPI
      - run: pip install build setuptools wheel
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: build (no extension)
        run: CQSA_SKIP_EXT=1 python -m build --wheel --sdist --no-isolation
      - uses: actions/upload-artifact@v4
        with: { name: pure, path: dist/* }

  # CUDA wheels: opt-in. Measured on the hosted runner of this private repo (2 cores,
  # 7 GB): nvcc is terminated by the runner on the second file, and at one thread the
  # 12 kernel files would need ~10 h on 2 cores against the 6 h limit. The CUDA wheel
  # for our torch/CUDA pair is built on della (CQSA_BUILD_NATIVE=1 python setup.py
  # bdist_wheel) and attached to the release by hand.
  cuda:
    if: ${{ inputs.build_cuda }}
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.single && '["3.11"]' || '["3.10", "3.11", "3.12"]') }}
        torch: ${{ fromJSON(inputs.single && '["2.6.0"]' || '["2.5.1", "2.6.0"]') }}
        cuda: ["12.4.1"]
        # one GPU architecture per job (A100 = sm80, H100 = sm90): keeps each job inside the
        # 6 h limit on a 4-core runner; the wheel name carries the arch
        arch: ${{ fromJSON(inputs.single && '["80"]' || '["80", "90"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      # full toolkit from the runfile: the network install with a sub-package list either
      # misses headers torch includes (cusparse.h) or trips apt on a package name
      - uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda
        with:
          cuda: "${{ matrix.cuda }}"
          method: local
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
      - name: install torch
        run: |
          CU=$(echo ${{ matrix.cuda }} | cut -d. -f1,2 | tr -d .)
          pip install setuptools wheel ninja packaging numpy
          pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cu${CU}
          python -c "import torch; print(torch.__version__, torch.version.cuda)"
      - name: build
        env:
          CUDA_HOME: "${{ steps.cuda.outputs.CUDA_PATH }}"
          # hosted runners: 4 cores, 16 GB. One kernel file at a time (each nvcc
          # invocation compiles one file for every arch, several GB per arch), A100
          # and H100 only; other cards build from source. Two files in flight for four
          # archs exhausted the memory and the runner killed the job (exit 143).
          FLASH_ATTN_CUDA_ARCHS: "${{ matrix.arch }}"
          CQSA_KERNEL_SET: common
          MAX_JOBS: "1"
          NVCC_THREADS: "2"
        run: |
          echo "CUDA_HOME=$CUDA_HOME"; "$CUDA_HOME/bin/nvcc" --version | tail -1
          echo "--- machine before the build"; nproc; free -g; df -h / /tmp | tail -2
          rm -f /tmp/*.run 2>/dev/null || true       # the toolkit runfile (4 GB) is not needed any more
          df -h / | tail -1
          python setup.py bdist_wheel --dist-dir dist
          echo "--- machine after the build"; free -g; df -h / | tail -1
      - name: tag the wheel with its torch/CUDA
        run: |
          pip install wheel
          CU=$(echo ${{ matrix.cuda }} | cut -d. -f1,2 | tr -d .)
          TV=$(echo ${{ matrix.torch }} | cut -d. -f1,2)
          for w in dist/*.whl; do python -m wheel tags --build "cu${CU}torch${TV}sm${{ matrix.arch }}" --remove "$w"; done
          ls dist
      - uses: actions/upload-artifact@v4
        with: { name: "cuda-py${{ matrix.python }}-torch${{ matrix.torch }}-cu${{ matrix.cuda }}-sm${{ matrix.arch }}", path: dist/*.whl }

  release:
    needs: [pure, cuda]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.pure.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Optional: PyPI. Register the project on pypi.org with a "trusted publisher" for this
  # repository and workflow (no token needed), then set the repository variable
  # PYPI_PUBLISH=true. Only the pure wheel and the sdist go to PyPI (the CUDA wheels are
  # too large for it and stay on the release page, as flash-attn does).
  pypi:
    needs: [pure]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pure, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
